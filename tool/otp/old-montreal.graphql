query OldMontrealRoute($modes: PlanModesInput!) {
  planConnection(
    origin: { location: { coordinate: { latitude: 45.50455, longitude: -73.55610 } } }
    destination: { location: { coordinate: { latitude: 45.50905, longitude: -73.55118 } } }
    modes: $modes
    first: 1
  ) {
    routingErrors { code description }
    edges {
      node {
        duration
        legs {
          mode
          distance
          legGeometry { length points }
        }
      }
    }
  }
}
